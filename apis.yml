        type: NuGet
    description: >-
      Reqnroll is the open-source community continuation and fork of SpecFlow,
      maintaining full backward compatibility while supporting .NET 8.0 and
      .NET 9.0. Created in 2024 after Tricentis announced SpecFlow end-of-life,
      Reqnroll has over 5,000 active projects and a growing contributor base.
