name: SpecFlow
description: >-
  SpecFlow was an open-source BDD (Behavior-Driven Development) testing framework
  for .NET that allowed teams to write executable specifications in natural language
  using the Gherkin syntax. Originally developed by TechTalk, it was acquired by
  Tricentis in 2020 and reached end-of-life on December 31, 2024. The community
  continuation is Reqnroll, a fork maintaining full backward compatibility.
