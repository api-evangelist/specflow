    description: >-
      SpecFlow is a BDD framework for .NET that bridges the communication gap
      between domain experts and developers by enabling natural language
      specifications (Gherkin) to be executed as automated tests. It supports
      NUnit, xUnit, and MSTest as underlying test runners. Reached end-of-life
      December 31, 2024; succeeded by the community-driven Reqnroll project.
